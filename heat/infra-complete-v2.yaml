heat_template_version: 2018-08-31

description: >
  Infrastructure openstack complète TD5 : réseau privé, sous-réseau, routeur,
  instance et volume attaché. !!Test-Governance-2!!

parameters:
  image:
    type: string
    default: cirros-0.6.3-x86_64-disk
  flavor:
    type: string
    default: m1.nano
  external_network:
    type: string
    default: public

resources:
  mon_reseau:
    type: OS::Neutron::Net
    properties:
      name: reseau-heat

  mon_sous_reseau:
    type: OS::Neutron::Subnet
    properties:
      name: subnet-heat
      network: { get_resource: mon_reseau }
      cidr: 10.0.2.0/24
      gateway_ip: 10.0.2.1
      dns_nameservers: [8.8.8.8]

  mon_routeur:
    type: OS::Neutron::Router
    properties:
      name: routeur-heat
      external_gateway_info:
        network: { get_param: external_network }

  interface_routeur:
    type: OS::Neutron::RouterInterface
    properties:
      router: { get_resource: mon_routeur }
      subnet: { get_resource: mon_sous_reseau }

  sg_ssh:
    type: OS::Neutron::SecurityGroup
    properties:
      name: sg-ssh-heat
      rules:
        - protocol: tcp
          port_range_min: 22
          port_range_max: 22
          direction: ingress

  mon_volume:
    type: OS::Cinder::Volume
    properties:
      name: volume-heat
      size: 1

  vm1:
    type: OS::Nova::Server
    properties:
      name: vm1-caddy
      image: { get_param: image }
      flavor: { get_param: flavor }
      networks:
        - network: { get_resource: mon_reseau }
      security_groups:
        - { get_resource: sg_ssh }
      user_data: |
        #!/bin/bash
        apt-get update
        apt-get install -y caddy
        IP=$(hostname -I | awk '{print $1}')
        mkdir -p /var/www/html
        cat > /var/www/html/index.html <<EOF
        <html><body><h1>VM1</h1><p>IP: $IP</p>
        </body></html>
        EOF
        systemctl restart caddy

  vm2:
    type: OS::Nova::Server
    properties:
      name: vm2-caddy
      image: { get_param: image }
      flavor: { get_param: flavor }
      networks:
        - network: { get_resource: mon_reseau }
      security_groups:
        - { get_resource: sg_ssh }
      user_data: |
        #!/bin/bash
        apt-get update
        apt-get install -y caddy
        IP=$(hostname -I | awk '{print $1}')
        mkdir -p /var/www/html
        cat > /var/www/html/index.html <<EOF
        <html><body><h1>VM2</h1><p>IP: $IP</p>
        </body></html>
        EOF
        systemctl restart caddy
  mon_load_balancer:
    type: OS::Octavia::LoadBalancer
    properties:
      name: lb-octavia
      vip_subnet: { get_resource: mon_subnet }

  mon_listener:
    type: OS::Octavia::Listener
    properties:
      name: listener-http
      protocol: HTTP
      protocol_port: 80
      loadbalancer: { get_resource: mon_load_balancer }

  mon_pool:
    type: OS::Octavia::Pool
    properties:
      name: pool-vms
      protocol: HTTP
      lb_algorithm: ROUND_ROBIN
      listener: { get_resource: mon_listener }

  vm1_member:
    type: OS::Octavia::PoolMember
    properties:
      pool: { get_resource: mon_pool }
      address: { get_attr: [vm1, networks, { get_attr: [mon_reseau, name] }, 0] }
      protocol_port: 80
      subnet: { get_resource: mon_subnet }

  vm2_member:
    type: OS::Octavia::PoolMember
    properties:
      pool: { get_resource: mon_pool }
      address: { get_attr: [vm2, networks, { get_attr: [mon_reseau, name] }, 0] }
      protocol_port: 80
      subnet: { get_resource: mon_subnet }

  lb_floating_ip:
    type: OS::Neutron::FloatingIP
    properties:
      floating_network: public
      port_id: { get_attr: [mon_load_balancer, vip_port_id] }

  attachement:
    type: OS::Cinder::VolumeAttachment
    properties:
      volume_id: { get_resource: mon_volume }
      instance_uuid: { get_resource: mon_instance }

outputs:
  instance_ip:
    description: IP privée de l'instance
    value: { get_attr: [mon_instance, first_address] }
  instance_id:
    description: ID de l'instance
    value: { get_resource: mon_instance }
  lb_floating_ip:
    description: Adresse IP flottante du load balancer
    value: { get_attr: [lb_floating_ip, floating_ip_address] }
  vm1_ip:
    description: IP privée de VM1
    value: { get_attr: [vm1, networks, { get_attr: [mon_reseau, name] }, 0] }
  vm2_ip:
    description: IP privée de VM2
    value: { get_attr: [vm2, networks, { get_attr: [mon_reseau, name] }, 0] }
