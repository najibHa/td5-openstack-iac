heat_template_version: 2018-08-31

description: Infrastructure OpenStack - Exercice 2 Load Balancing Octavia

parameters:
  image:
    type: string
    default: Fedora-Cloud-Base-37-1.7.x86_64

  flavor:
    type: string
    default: m1.small

  external_network:
    type: string
    default: public


resources:

  mon_reseau:
    type: OS::Neutron::Net
    properties:
      name: reseau-heat


  mon_sous_reseau:
    type: OS::Neutron::Subnet
    properties:
      name: subnet-heat
      network:
        get_resource: mon_reseau
      cidr: 10.0.2.0/24
      gateway_ip: 10.0.2.1
      dns_nameservers:
        - 8.8.8.8


  mon_routeur:
    type: OS::Neutron::Router
    properties:
      name: routeur-heat
      external_gateway_info:
        network:
          get_param: external_network


  interface_routeur:
    type: OS::Neutron::RouterInterface
    properties:
      router:
        get_resource: mon_routeur
      subnet:
        get_resource: mon_sous_reseau


  sg_web:
    type: OS::Neutron::SecurityGroup
    properties:
      name: sg-web-heat
      rules:
        - protocol: tcp
          port_range_min: 22
          port_range_max: 22
          direction: ingress
          ethertype: IPv4

        - protocol: tcp
          port_range_min: 80
          port_range_max: 80
          direction: ingress
          ethertype: IPv4

        - protocol: icmp
          direction: ingress
          ethertype: IPv4


  port_vm1:
    type: OS::Neutron::Port
    properties:
      network:
        get_resource: mon_reseau
      security_groups:
        - get_resource: sg_web
      fixed_ips:
        - subnet:
            get_resource: mon_sous_reseau


  port_vm2:
    type: OS::Neutron::Port
    properties:
      network:
        get_resource: mon_reseau
      security_groups:
        - get_resource: sg_web
      fixed_ips:
        - subnet:
            get_resource: mon_sous_reseau


  vm1:
    type: OS::Nova::Server
    properties:
      name: vm1
      image:
        get_param: image
      flavor:
        get_param: flavor

      networks:
        - port:
            get_resource: port_vm1

      user_data_format: RAW
      user_data: |
        #!/bin/bash
        set -eux

        dnf install -y caddy

        IP=$(hostname -I | awk '{print $1}')

        mkdir -p /usr/share/caddy

        cat > /usr/share/caddy/index.html <<EOF
        <html>
          <body>
            <h1>Serveur : VM1</h1>
            <p>Adresse IP privee : $IP</p>
          </body>
        </html>
        EOF

        cat > /etc/caddy/Caddyfile <<EOF
        :80 {
          root * /usr/share/caddy
          file_server
        }
        EOF

        systemctl enable --now caddy


  vm2:
    type: OS::Nova::Server
    properties:
      name: vm2
      image:
        get_param: image
      flavor:
        get_param: flavor

      networks:
        - port:
            get_resource: port_vm2

      user_data_format: RAW
      user_data: |
        #!/bin/bash
        set -eux

        dnf install -y caddy

        IP=$(hostname -I | awk '{print $1}')

        mkdir -p /usr/share/caddy

        cat > /usr/share/caddy/index.html <<EOF
        <html>
          <body>
            <h1>Serveur : VM2</h1>
            <p>Adresse IP privee : $IP</p>
          </body>
        </html>
        EOF

        cat > /etc/caddy/Caddyfile <<EOF
        :80 {
          root * /usr/share/caddy
          file_server
        }
        EOF

        systemctl enable --now caddy


  load_balancer:
    type: OS::Octavia::LoadBalancer
    depends_on:
      - interface_routeur
    properties:
      name: lb-heat
      vip_subnet:
        get_resource: mon_sous_reseau


  listener_http:
    type: OS::Octavia::Listener
    properties:
      name: listener-http
      loadbalancer:
        get_resource: load_balancer
      protocol: HTTP
      protocol_port: 80


  pool_http:
    type: OS::Octavia::Pool
    properties:
      name: pool-http
      listener:
        get_resource: listener_http
      protocol: HTTP
      lb_algorithm: ROUND_ROBIN


  member_vm1:
    type: OS::Octavia::PoolMember
    properties:
      pool:
        get_resource: pool_http
      address:
        get_attr:
          - port_vm1
          - fixed_ips
          - 0
          - ip_address
      protocol_port: 80
      subnet:
        get_resource: mon_sous_reseau


  member_vm2:
    type: OS::Octavia::PoolMember
    properties:
      pool:
        get_resource: pool_http
      address:
        get_attr:
          - port_vm2
          - fixed_ips
          - 0
          - ip_address
      protocol_port: 80
      subnet:
        get_resource: mon_sous_reseau


  lb_floating_ip:
    type: OS::Neutron::FloatingIP
    properties:
      floating_network:
        get_param: external_network
      port_id:
        get_attr:
          - load_balancer
          - vip_port_id


outputs:

  load_balancer_ip:
    description: Adresse IP flottante du Load Balancer
    value:
      get_attr:
        - lb_floating_ip
        - floating_ip_address

  vm1_ip:
    description: Adresse IP privee de VM1
    value:
      get_attr:
        - port_vm1
        - fixed_ips
        - 0
        - ip_address

  vm2_ip:
    description: Adresse IP privee de VM2
    value:
      get_attr:
        - port_vm2
        - fixed_ips
        - 0
        - ip_address

  instance_ip:
    description: IP privee utilisee par le smoke test CI
    value:
      get_attr:
        - port_vm1
        - fixed_ips
        - 0
        - ip_address

  instance_id:
    description: ID utilise par le smoke test CI
    value:
      get_resource: vm1
